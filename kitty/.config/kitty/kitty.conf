# Kitty config ported from alacritty/.config/alacritty/alacritty.toml

# Shell
shell /bin/zsh

# Font
font_family FiraCode Nerd Font Mono
bold_font auto
italic_font auto
bold_italic_font auto
font_size 14.0

# Cursor: use a block cursor instead of Kitty's thin beam default.
cursor_shape block
cursor_blink_interval 0
cursor_stop_blinking_after 0

# Selection / clipboard
copy_on_select yes

# Mouse bindings matching the old Alacritty behavior:
# Shift+Left copies the current selection; Shift+Right pastes from clipboard.
mouse_map shift+left release ungrabbed copy_to_clipboard
mouse_map shift+right press ungrabbed paste_from_clipboard

# Window
confirm_os_window_close 0
remember_window_size yes
initial_window_width 800
initial_window_height 600
background_opacity 1.0

# Wayland-friendly behavior
linux_display_server wayland

# Alacritty-like dark default palette. The old Alacritty config did not define
# custom colors, so keep this simple and closer to common terminal defaults
# instead of Kitty's higher-contrast default theme.
foreground #d8d8d8
background #181818
selection_foreground #181818
selection_background #b4d5ff

cursor #d8d8d8
cursor_text_color #181818

color0 #181818
color1 #ab4642
color2 #a1b56c
color3 #f7ca88
color4 #7cafc2
color5 #ba8baf
color6 #86c1b9
color7 #d8d8d8
color8 #585858
color9 #ab4642
color10 #a1b56c
color11 #f7ca88
color12 #7cafc2
color13 #ba8baf
color14 #86c1b9
color15 #f8f8f8
